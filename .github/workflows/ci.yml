# CI (ES-14): every component's build, test and check commands and the scanners, on every push.
# Versions follow tech-stack.md and docs/decisions-log.md (Node 24.13.0 by D-01, Java 21).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 02_output/backend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "21.0.8"
          cache: maven
      - name: Check (format, lint, duplication)
        run: ./mvnw -B -ntp spotless:check pmd:check pmd:cpd-check
      - name: Build, test and integration test (Testcontainers needs Docker, present on the runner)
        run: ./mvnw -B -ntp verify
      # The NVD database is large: keep it between runs, refreshed at least once a week.
      - name: Week number for the NVD cache
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4.2.3
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ steps.week.outputs.week }}
          restore-keys: nvd-
      - name: Dependency scan (SB-08, SR-19; accepted findings in dependency-check-suppressions.xml)
        run: ./mvnw -B -ntp org.owasp:dependency-check-maven:12.1.6:check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        continue-on-error: false
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: backend-reports
          path: |
            02_output/backend/target/surefire-reports
            02_output/backend/target/failsafe-reports
            02_output/backend/target/site/jacoco
            02_output/logs/dependency-check

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 02_output/frontend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: 02_output/frontend/package-lock.json
      - run: npm ci --no-fund
      - name: Check (format, lint, type check, duplication)
        run: npm run check
      - name: Contracts validate (phase 2 gate)
        run: npm run contracts:validate
      - name: Generated API types are up to date (AR-13)
        run: |
          npm run api:types
          git diff --exit-code -- src/lib/api/schema.d.ts
      - name: Unit and component tests with coverage
        run: npm test
      - name: Build
        run: npm run build
      - name: Dependency scan (SB-08, SR-19; allow-list D-08)
        run: npm run scan
      - name: Licences, forbidden imports, SCM search (NFR-14, SR-19)
        run: node ../scripts/licence-check.mjs
      # The acceptance and end-to-end tests need the whole local stack (database, backend, Firebase
      # Authentication Emulator, web app) with the seed data, as in the README quick start.
      - name: Start the local stack with the emulator and load the seed data
        working-directory: 02_output
        run: |
          printf 'DB_PASSWORD=ci-only\nFIREBASE_WEB_API_KEY=fake-api-key\n' > ../.env
          docker compose --env-file ../.env up --build -d --wait
          bash scripts/seed.sh
      - name: Browser tests (NFR-07, NFR-08, NFR-09)
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
      - name: Stack logs on failure
        if: failure()
        working-directory: 02_output
        run: docker compose --env-file ../.env logs --no-color --tail 200
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: frontend-reports
          path: |
            02_output/frontend/coverage
            02_output/logs/screenshots

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Secret scan (SB-09, SR-12)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 detect --source /repo --no-banner --redact

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Build the delivered images once (ADR-10)
        run: |
          printf 'DB_PASSWORD=ci-only\n' > /tmp/ci.env
          docker compose -f 02_output/docker-compose.yml --project-directory 02_output --env-file /tmp/ci.env build
