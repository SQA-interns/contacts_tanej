# TLS front proxy of the delivered stack (SR-04, SB-04): HTTPS only, HSTS, HTTP redirects to HTTPS.
# The certificate and key are the customer's, mounted at /etc/nginx/certs/tls.crt and tls.key.
# Listens on 8080 and 8443 inside the container, published as 80 and 443.
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
  # SB-11: the container runs as user 101; every temporary path is writable by it
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  server {
    listen 8080;
    return 301 https://$host$request_uri;
  }

  server {
    listen 8443 ssl;
    http2 on;
    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
      proxy_pass http://frontend:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      client_max_body_size 1m;
    }
  }
}
