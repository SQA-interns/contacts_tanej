# Every environment-specific value comes from an environment variable (ES-01, NFR-12, AR-12).
# A variable without a default is required: the API refuses to start without it.
# Defaults for local and test live in application-local.yml (profile "local"), never here.
spring:
  application:
    name: contact-groups-backend
  datasource:
    # DB_URL, or its parts (DB_HOST, DB_PORT, DB_NAME) as some hosts such as Render provide them
    url: ${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # a stopped database must make the health check answer 503 quickly (R-017-12)
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      enabled: false

app:
  firebase-project-id: ${FIREBASE_PROJECT_ID}
  firebase-auth-emulator-host: ${FIREBASE_AUTH_EMULATOR_HOST:}
  allowed-origin: ${APP_ALLOWED_ORIGIN}
  trash-cleanup-cron: ${TRASH_CLEANUP_CRON:0 30 3 * * *}
  rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:100}

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
  tomcat:
    max-swallow-size: 2MB

logging:
  level:
    root: ${LOG_LEVEL:INFO}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false
