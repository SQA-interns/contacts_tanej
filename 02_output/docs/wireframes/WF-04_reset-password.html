<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>WF-04 Reset password confirmation – Contact Groups (wireframe)</title><link rel="stylesheet" href="wireframe.css"></head>
<body><a class="skip" href="#main">Skip to content</a>
<header class="site-header"><div class="wrap">
  <span class="logo" role="img" aria-label="Logo placeholder">Logo</span><a class="brand" href="#">Contact Groups</a>
  <div class="header-tools">
    
    <div class="lang" role="group" aria-label="Language"><button type="button" class="btn" aria-pressed="false">SL</button><button type="button" class="btn" aria-pressed="true">EN</button></div>
    
  </div></div></header>
<main id="main" class="wrap">

<div class="pagehead"><h1>Check your e-mail</h1></div>

<div class="narrow card plain"><p>If an account exists for this address, we sent a link to reset the password.</p><button type="button" class="btn primary" >Back to sign in</button></div>
<section class="state" aria-label="State: Error"><span class="tag">State: Error</span><div class="narrow card plain"><div class="notice strong" role="alert"><span class="ico" aria-hidden="true"></span><div>The link is not valid or has expired.</div></div><button type="button" class="btn secondary" >Send a new link</button></div></section>
</main>
<footer class="site-footer"><div class="wrap"><span>Contact Groups</span><span>Slovenščina · English</span></div></footer></body></html>
