<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>WF-03 Verify your e-mail – Contact Groups (wireframe)</title><link rel="stylesheet" href="wireframe.css"></head>
<body><a class="skip" href="#main">Skip to content</a>
<header class="site-header"><div class="wrap">
  <span class="logo" role="img" aria-label="Logo placeholder">Logo</span><a class="brand" href="#">Contact Groups</a>
  <div class="header-tools">
    
    <div class="lang" role="group" aria-label="Language"><button type="button" class="btn" aria-pressed="false">SL</button><button type="button" class="btn" aria-pressed="true">EN</button></div>
    
  </div></div></header>
<main id="main" class="wrap">

<div class="pagehead"><h1>Verify your e-mail</h1></div>

<div class="narrow card plain"><p>We sent a message to <span class="bar m" role="img" aria-label="your e-mail address"></span>. Open the link in it, then come back and sign in.</p><button type="button" class="btn secondary" >Send again</button><button type="button" class="btn ghost" >Sign out</button></div>
<section class="state" aria-label="State: Message sent again"><span class="tag">State: Message sent again</span><div class="narrow card plain"><p class="toast" role="status"><span class="ico" aria-hidden="true"></span> We sent the message again.</p><button type="button" class="btn secondary" >Send again</button><button type="button" class="btn ghost" >Sign out</button></div></section>
<section class="state" aria-label="State: Error (too many requests)"><span class="tag">State: Error (too many requests)</span><div class="narrow card plain"><div class="notice strong" role="alert"><span class="ico" aria-hidden="true"></span><div>Too many requests. Try again in a moment.</div></div><button type="button" class="btn secondary" >Send again</button></div></section>
</main>
<footer class="site-footer"><div class="wrap"><span>Contact Groups</span><span>Slovenščina · English</span></div></footer></body></html>
